version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: booking_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: booking_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: booking_app
    depends_on:
      - db
    environment:
      DB_URL: jdbc:mysql://db:3306/booking_db
      DB_USERNAME: root
      DB_PASSWORD: password
      JWT_SECRET: change_this_secret_very_long_change_this_secret_very_long
    ports:
      - "8080:8080"

volumes:
  db_data:
